# Serves the built dashboard and proxies the API on the same origin.
#
# Same origin matters. The browser never sends a CORS preflight, and
# VITE_API_URL can stay on its relative default everywhere.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Don't tell the internet which nginx version this is.
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        image/svg+xml;

    # ----------------------------------------------------------------------
    # Static assets
    #
    # Vite puts a content hash in every asset filename, so the bytes behind a
    # given URL never change. That's exactly what `immutable` is for: the
    # browser won't even send a revalidation request.
    # ----------------------------------------------------------------------
    location /assets/ {
        # add_header only. `expires` would send a second Cache-Control line,
        # and two of them is a mess for caches.
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached. It's the file that points at the
    # current asset hashes. Cache it and people keep loading a bundle that no
    # longer exists after each deploy.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ----------------------------------------------------------------------
    # API and OpenAPI docs
    # ----------------------------------------------------------------------
    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # The API needs these to rate limit on the real client IP. Without
        # them every visitor shares this proxy's bucket.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location /docs {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Basic hardening. The app loads no outside scripts, fonts or frames.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
